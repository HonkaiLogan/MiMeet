<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi搭子 - Meet你的命中搭子</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.31/h5-js-sdk-lark.js"></script>
    <style>
        .hidden { display: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .nav-item { transition: all 0.15s ease; }
        .nav-item.active { background: #fff7ed; color: #f97316; }
        .nav-item.active svg { fill: #f97316; }
        .nav-item:hover:not(.active) { background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="flex min-h-screen">
        <!-- ========== 左侧导航栏 ========== -->
        <aside class="w-56 bg-white border-r flex flex-col flex-shrink-0">
            <!-- Logo -->
            <div class="p-5 border-b">
                <h1 class="text-xl font-bold text-orange-500">🍜 Mi 搭子</h1>
                <p class="text-xs text-gray-400 mt-1">Meet 你的命中搭子</p>
            </div>
            <!-- 导航菜单 -->
            <nav class="flex-1 p-3 space-y-1">
                <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-600 active" data-page="home">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2L2 8v10h6v-5h4v5h6V8L10 2z"/></svg>
                    首页
                </button>
                <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-600" data-page="square">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm0 2h12v10H4V5z"/></svg>
                    搭子广场
                </button>
                <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-600" data-page="daily">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11H9v-2h2v2zm0-4H9V5h2v4z"/></svg>
                    每日推荐
                </button>
                <div class="border-t my-2"></div>
                <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-600" data-page="mine">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a4 4 0 100 8 4 4 0 000-8zm-7 14a7 7 0 0114 0H3z"/></svg>
                    个人中心
                </button>
            </nav>
            <!-- 底部登录 -->
            <div class="p-3 border-t">
                <a href="/auth/login" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-50">
                    🔑 飞书登录
                </a>
            </div>
        </aside>

        <!-- ========== 主内容区 ========== -->
        <main class="flex-1 overflow-y-auto">

            <!-- ========== 首页 ========== -->
            <div id="page-home" class="p-8">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">欢迎使用 Mi 搭子</h2>
                    <p class="text-gray-400 mt-1">选择一个场景，找到你的命中搭子</p>
                </div>
                <div class="grid grid-cols-2 gap-6 max-w-2xl">
                    <button id="btn-lunch" class="bg-white rounded-2xl p-8 shadow-sm text-left hover:shadow-lg hover:-translate-y-1 transition-all border border-transparent hover:border-orange-200">
                        <div class="text-4xl mb-3">🍜</div>
                        <h3 class="text-xl font-bold text-gray-800">午餐拼桌</h3>
                        <p class="text-gray-400 text-sm mt-2">找到口味相投的饭搭子</p>
                    </button>
                    <button id="btn-commute" class="bg-white rounded-2xl p-8 shadow-sm text-left hover:shadow-lg hover:-translate-y-1 transition-all border border-transparent hover:border-orange-200">
                        <div class="text-4xl mb-3">🚗</div>
                        <h3 class="text-xl font-bold text-gray-800">通勤拼车</h3>
                        <p class="text-gray-400 text-sm mt-2">找到路线相近的拼车搭子</p>
                    </button>
                </div>
            </div>

            <!-- ========== 画像设置页 ========== -->
            <div id="page-profile" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">🧑 设置我的画像</h2>
                <div class="grid grid-cols-2 gap-x-8 gap-y-5 max-w-2xl bg-white rounded-2xl p-8 shadow-sm">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">口味偏好</label>
                        <input id="taste" type="text" placeholder="如：清淡、川菜、轻食" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">就餐时间</label>
                        <input id="time-pref" type="text" placeholder="如：12:30" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">常去食堂</label>
                        <input id="location" type="text" placeholder="如：B1食堂" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">预算范围</label>
                        <input id="budget" type="text" placeholder="如：20-40元" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">社交偏好</label>
                        <select id="social-pref" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                            <option value="chat">想边吃边聊</option>
                            <option value="quiet">安静吃饭</option>
                            <option value="either">都可以</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">兴趣标签</label>
                        <input id="interests" type="text" placeholder="如：AI,产品,篮球" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 focus:border-orange-400 outline-none">
                    </div>
                    <div class="col-span-2 pt-2">
                        <button onclick="saveProfile()" class="bg-orange-500 text-white px-8 py-2.5 rounded-lg font-bold hover:bg-orange-600 transition">
                            保存画像
                        </button>
                    </div>
                </div>
            </div>

            <!-- ========== 匹配结果页 ========== -->
            <div id="page-match" class="p-8 hidden">
                <div class="flex items-center mb-6">
                    <button onclick="showPage('home')" class="text-gray-400 hover:text-gray-600 mr-3 text-sm">← 返回</button>
                    <h2 class="text-2xl font-bold text-gray-800">🎯 匹配结果</h2>
                </div>
                <div id="match-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl">
                    <p class="text-center text-gray-400 col-span-full">正在匹配中...</p>
                </div>
            </div>

            <!-- ========== 搭子广场 ========== -->
            <div id="page-square" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">📢 搭子广场</h2>
                <div class="max-w-3xl">
                    <!-- 发布表单 -->
                    <div class="bg-white rounded-2xl p-6 mb-6 shadow-sm">
                        <div class="grid grid-cols-3 gap-3 mb-3">
                            <select id="post-scene" class="border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 outline-none">
                                <option value="lunch">🍜 午餐拼桌</option>
                                <option value="commute">🚗 通勤拼车</option>
                            </select>
                            <input id="post-time" type="text" placeholder="期望时间（如 12:30）" class="border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 outline-none">
                            <button onclick="publishPost()" class="bg-orange-500 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-orange-600 transition">
                                发布需求
                            </button>
                        </div>
                        <textarea id="post-content" rows="2" placeholder="描述你的搭子需求..." class="w-full border rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-200 outline-none"></textarea>
                    </div>
                    <!-- 列表 -->
                    <div id="square-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- ========== 每日推荐 ========== -->
            <div id="page-daily" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">🌟 每日幸运推荐</h2>
                <div id="daily-content" class="bg-white rounded-2xl p-8 shadow-sm max-w-lg">
                    <p class="text-center text-gray-400">加载中...</p>
                </div>
            </div>

            <!-- ========== 个人中心 ========== -->
            <div id="page-mine" class="p-8 hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">👤 个人中心</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
                    <button onclick="showPage('profile')" class="bg-white rounded-xl p-5 shadow-sm text-left hover:shadow-md transition flex items-center gap-3">
                        <span class="text-2xl">📝</span>
                        <div>
                            <div class="font-bold text-gray-800">编辑我的画像</div>
                            <div class="text-xs text-gray-400 mt-0.5">设置口味、时间、兴趣等偏好</div>
                        </div>
                    </button>
                    <button onclick="showPage('history'); loadHistory()" class="bg-white rounded-xl p-5 shadow-sm text-left hover:shadow-md transition flex items-center gap-3">
                        <span class="text-2xl">📊</span>
                        <div>
                            <div class="font-bold text-gray-800">历史匹配记录</div>
                            <div class="text-xs text-gray-400 mt-0.5">查看过往匹配和反馈</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- ========== 历史匹配记录 ========== -->
            <div id="page-history" class="p-8 hidden">
                <div class="flex items-center mb-6">
                    <button onclick="showPage('mine')" class="text-gray-400 hover:text-gray-600 mr-3 text-sm">← 返回</button>
                    <h2 class="text-2xl font-bold text-gray-800">📊 历史匹配记录</h2>
                </div>
                <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl">
                    <p class="text-center text-gray-400 col-span-full">加载中...</p>
                </div>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
